<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Weather App</title>
</head>
<body>

    <h1 class="maintitle">Weather App</h1>
    <p class="subtitle">Check the weather in any city</p>

    <form class="weatherform">
        <input 
        type="text" 
        class="cityinput"
        placeholder="Enter a city">
        
        <button type="submit">Get Weather</button>
    </form>

    <div class="card" style="display: none;">

      <!--
        <h1 class="citydisplay">Sour</h1>
        <p class="tempdisplay">90°F</p>
        <p class="Humiditydisplay">Humidity: 75%</p>
        <p class="descdisplay">Clear Skies</p>
        <p class="weatheremoji">☀️</p>
        <p class="errordisplay">Please enter a city</p>
      -->

    </div>

    <script src="script.js"></script>
</body>
</html>
